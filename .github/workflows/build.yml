name: Build EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - run: pyinstaller -F -w --name KaoYanVocab kaoyan_vocab.py
      - uses: actions/upload-artifact@v5
        with:
          name: KaoYanVocab
          path: dist/KaoYanVocab.exe
